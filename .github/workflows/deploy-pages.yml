name: Deploy Pages
# Canonical origin (D-33 D5, D-36 rule 1). One place only: a future brand domain is a repo
# variable change (Settings → Variables → SITE_ORIGIN / SITE_BASE) + the Pages custom domain.
# Step-level env silently overrides this block: only the base-portability check below may do it.
env:
  SITE: ${{ vars.SITE_ORIGIN || 'https://neoplastix.crea-comm.net' }}
  BASE: ${{ vars.SITE_BASE || '/' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # D-36: production is served at root, where a hardcoded "/gallery/" would work by accident.
      # Build once under a dummy base so assert-dist-links catches any href that skips withBase.
      - name: Base-portability check
        run: pnpm --filter @mondrian/web build
        env:
          BASE: /__base-check__

      - name: Build Astro site
        run: pnpm --filter @mondrian/web build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: services/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
